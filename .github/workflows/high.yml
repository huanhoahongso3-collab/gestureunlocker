name: Build & Prerelease APKs

on:
  push:
    branches:
      - main # Change this to your default branch if it's 'master'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      # 1. Properly setup a modern version of Gradle if gradlew is missing
      - name: Setup Gradle (Fallback)
        if: ${{ hashFiles('gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5' # Uses a modern Gradle version that supports dependencyResolutionManagement

      # 2. Generate the wrapper files using the modern Gradle version
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found! Generating modern wrapper..."
            gradle wrapper
          fi

      # 3. Automatically commit gradlew back to the repository
      - name: Commit and Push gradlew if missing
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: automatically restore missing gradle wrapper"
          file_pattern: 'gradlew gradlew.bat gradle/wrapper/*'
          disable_globbing: true

      # 4. Standard build steps
      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release Unsigned APK
        run: ./gradlew assembleRelease

      # 5. Create prerelease using the current commit SHA
      - name: Create Prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.sha }}
          tag_name: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            **/build/outputs/apk/debug/*-debug.apk
            **/build/outputs/apk/release/*-release-unsigned.apk